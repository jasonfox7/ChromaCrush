version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: chromacrush-postgres
    environment:
      POSTGRES_DB: chromacrush
      POSTGRES_USER: chromacrush
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-chromacrush_dev}
    ports:
      - "5432:5432"
    volumes:
      - chromacrush-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chromacrush -d chromacrush"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chromacrush-redis
    ports:
      - "6379:6379"
    volumes:
      - chromacrush-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  chromacrush-pgdata:
    driver: local
  chromacrush-redisdata:
    driver: local
