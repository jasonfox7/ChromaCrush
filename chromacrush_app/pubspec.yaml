name: chromacrush_app
description: "ChromaCrush — Match-3 versus game for iOS"
publish_to: 'none'
version: 2.0.0+21

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flame: ^1.22.0
  flutter_soloud: ^3.0.0
  provider: ^6.1.0
  http: ^1.2.0
  go_router: ^17.1.0
  shared_preferences: ^2.5.4
  sign_in_with_apple: ^6.1.0
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  ios: true
  android: false
  image_path: "assets/graphics/icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/music/
    - assets/menu_music/
    - assets/graphics/
    - assets/config/
  shaders:
    - shaders/gem_base.frag
    - shaders/ripple_background.frag
    - shaders/foil.frag
    - shaders/card_art.frag
  fonts:
    - family: CyproMinoan
      fonts:
        - asset: assets/fonts/NotoSansCyproMinoan-Regular.ttf
